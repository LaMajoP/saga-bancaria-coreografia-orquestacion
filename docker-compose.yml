services:
  api-gateway:
    build: ./api-gateway
    ports:
      - "${API_GATEWAY_PORT:-8000}:8000"
    environment:
      ACCOUNT_SERVICE_URL: http://account-service:8000
      RISK_SERVICE_URL: http://risk-service:8000
      CLEARING_SERVICE_URL: http://clearing-service:8000
      GATEWAY_DATABASE_URL: ${GATEWAY_DATABASE_URL:?GATEWAY_DATABASE_URL is required}
    depends_on:
      - account-service
      - risk-service
      - clearing-service

  account-service:
    build: ./account-service
    ports:
      - "${ACCOUNT_SERVICE_PORT:-8001}:8000"
    environment:
      ACCOUNT_DATABASE_URL: ${ACCOUNT_DATABASE_URL:?ACCOUNT_DATABASE_URL is required}

  risk-service:
    build: ./risk-service
    ports:
      - "${RISK_SERVICE_PORT:-8002}:8000"
    environment:
      RISK_DATABASE_URL: ${RISK_DATABASE_URL:?RISK_DATABASE_URL is required}
      RISK_MAX_AMOUNT: ${RISK_MAX_AMOUNT:-1000000}

  clearing-service:
    build: ./clearing-service
    ports:
      - "${CLEARING_SERVICE_PORT:-8003}:8000"
    environment:
      CLEARING_DATABASE_URL: ${CLEARING_DATABASE_URL:?CLEARING_DATABASE_URL is required}
      CLEARING_LATENCY_SECONDS: ${CLEARING_LATENCY_SECONDS:-0}
      CLEARING_TIMEOUT_SECONDS: ${CLEARING_TIMEOUT_SECONDS:-3}
