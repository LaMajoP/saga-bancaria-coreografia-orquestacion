services:
  api-gateway:
    build: ./api-gateway
    ports:
      - "${API_GATEWAY_PORT:-8000}:8000"
    environment:
      ACCOUNT_SERVICE_URL: http://account-service:8000
      RISK_SERVICE_URL: http://risk-service:8000
      CLEARING_SERVICE_URL: http://clearing-service:8000
    depends_on:
      - account-service
      - risk-service
      - clearing-service

  account-service:
    build: ./account-service
    ports:
      - "${ACCOUNT_SERVICE_PORT:-8001}:8000"
    environment:
      ACCOUNT_DB_PATH: /data/accounts.db
    volumes:
      - account_service_data:/data

  risk-service:
    build: ./risk-service
    ports:
      - "${RISK_SERVICE_PORT:-8002}:8000"

  clearing-service:
    build: ./clearing-service
    ports:
      - "${CLEARING_SERVICE_PORT:-8003}:8000"

volumes:
  account_service_data:
