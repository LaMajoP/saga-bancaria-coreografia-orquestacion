server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # DNS interno de Docker.
    #
    # Sin un resolver, nginx traduce los nombres de los servicios una sola vez,
    # al cargar la configuracion, y se queda con esa IP para siempre. En cuanto
    # un contenedor se recrea (un `docker compose up -d saga-service`, por
    # ejemplo) recibe una IP nueva y nginx sigue llamando a la antigua: el
    # sintoma es un 502 permanente aunque el servicio este perfectamente sano.
    #
    # Poner el upstream en una variable obliga a nginx a resolverlo en cada
    # peticion, usando este resolver, y el proxy sobrevive a los reinicios.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # El index.html nunca se cachea: apunta a bundles con hash en el nombre,
    # asi que si el navegador conserva una copia vieja sigue cargando el
    # JavaScript anterior y los arreglos no llegan nunca a la pantalla.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, must-revalidate";
    }

    # La traza de la saga la sirve el saga-service, no el Gateway.
    # nginx elige el prefijo mas largo, asi que esta gana sobre /api/.
    location /api/v1/sagas {
        set $upstream_saga http://saga-service:8000;
        proxy_pass $upstream_saga$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Solo lectura de saldos, para evidenciar que quedan intactos tras compensar.
    location /accounts {
        set $upstream_account http://account-service:8000;
        proxy_pass $upstream_account$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
        set $upstream_gateway http://api-gateway:8000;
        proxy_pass $upstream_gateway$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /health {
        set $upstream_health http://api-gateway:8000;
        proxy_pass $upstream_health$request_uri;
        proxy_set_header Host $host;
    }
}
