server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # La traza de la saga la sirve el saga-service, no el Gateway.
    # nginx elige el prefijo mas largo, asi que esta gana sobre /api/.
    location /api/v1/sagas {
        proxy_pass http://saga-service:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Solo lectura de saldos, para evidenciar que quedan intactos tras compensar.
    location /accounts {
        proxy_pass http://account-service:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
        proxy_pass http://api-gateway:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /health {
        proxy_pass http://api-gateway:8000;
        proxy_set_header Host $host;
    }
}
